name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Configuration and lifecycle tests
        run: nix develop --command python3 -m unittest discover -s tests
      - name: Generated files and scripts
        run: |
          nix build --no-link -L .#checks.x86_64-linux.configuration \
            .#checks.x86_64-linux.projectTrees .#checks.x86_64-linux.projectHelpers \
            .#checks.x86_64-linux.formats .#checks.x86_64-linux.shellcheck \
            .#checks.x86_64-linux.bootstrap .#checks.x86_64-linux.runtimeShellcheck
      - name: Evaluate aarch64 outputs
        run: nix eval --json .#checks.aarch64-linux --apply 'builtins.mapAttrs (_: value: value.drvPath)'

  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        odoo: [16, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build and initialize Odoo with disposable PostgreSQL
        run: nix build --no-link -L .#checks.x86_64-linux.odoo${{ matrix.odoo }}
